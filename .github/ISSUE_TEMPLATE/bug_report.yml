name: Bug report
description: Report a reproducible software, documentation, or integration problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Include only non-sensitive information. Do not expose credentials or unsafe mains wiring details.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, Windows version, board, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest sequence that demonstrates the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact personal data, ports if sensitive, and credentials.
