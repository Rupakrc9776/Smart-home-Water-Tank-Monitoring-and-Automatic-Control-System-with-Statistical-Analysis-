name: Python Validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create virtual environment
        run: python -m venv .venv-ci

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -r requirements.txt
          .venv-ci/bin/python -m pip check

      - name: Verify runtime imports
        run: |
          .venv-ci/bin/python -c "import tkinter; import serial; import pandas; import matplotlib; import ttkbootstrap"

      - name: Compile every Python file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' python_files < <(find . -type f -name '*.py' -not -path './.git/*' -not -path './.venv/*' -not -path './.venv-ci/*' -print0)
          if (( ${#python_files[@]} == 0 )); then
            echo "ERROR: no Python files were found."
            exit 1
          fi
          .venv-ci/bin/python -m py_compile "${python_files[@]}"

      - name: Run headless smoke test
        env:
          MPLBACKEND: Agg
        run: .venv-ci/bin/python -m unittest discover -s tests -v
