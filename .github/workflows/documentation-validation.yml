name: Documentation Validation

on: [push, pull_request]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f Documentation/Architecture.md
          test -f Documentation/Installation.md
          test -f Documentation/Hardware.md
          test -f Documentation/Software.md
          test -f Documentation/Dashboard.md
          test -f Documentation/Statistical_Analysis.md
          test -f Documentation/Testing.md
          test -f Documentation/Future_Scope.md
