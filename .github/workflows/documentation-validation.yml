name: Documentation Validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: documentation-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation and repository paths
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate local links and referenced media
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Documentation and repository path checks"
          python3 scripts/validate_docs.py
          echo "::endgroup::"
